# Trunk builds the client: the crate to WebAssembly, the loader, and hashed assets.
#
# There is no server-side rendering to configure. The app has to start from a precached shell
# with the radio off, so it is rendered entirely in the browser.
[build]
target = "crates/web/index.html"
dist = "crates/web/dist"

# Tailwind reads the Rust for the class names it has to emit, so it runs before the build that
# would otherwise beat it to the stylesheet.
[[hooks]]
stage = "pre_build"
command = "sh"
command_arguments = [
  "-c",
  "cd web && node_modules/.bin/tailwindcss --input app.css --output build/app.css --minify",
]

# Pdfium is copied out of node_modules rather than committed: it is four megabytes of Chrome's
# PDF engine, versioned by the lockfile like any other dependency. It is a plain copy, unhashed,
# because the sheet renderer fetches it by name at runtime rather than importing it.
[[hooks]]
stage = "pre_build"
command = "sh"
command_arguments = ["-c", "cd web && npm run --silent pdfium"]

[watch]
watch = ["crates/web/src", "crates/core/src", "crates/web/index.html", "web/app.css"]

[serve]
port = 4174
open = false

# In development the API is a separate process; proxying keeps the client on one origin, which is
# what it will be in production.
[[proxy]]
backend = "http://127.0.0.1:8080/api/v1"
