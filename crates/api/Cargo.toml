[package]
name = "aurum-api"
description = "The Aurum Presenter API and its console commands."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
aurum-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.37", features = ["bundled"] }
tower = "0.5"
argon2 = "0.5"
rand = "0.9"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
axum-extra = { version = "0.10", features = ["cookie"] }
http = "1"
totp-rs = { version = "5", features = ["otpauth"] }
aws-sdk-s3 = { version = "1", features = ["behavior-version-latest"] }
aws-config = "1"
aws-credential-types = "1"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "tokio1", "tokio1-rustls", "rustls-native-certs", "ring"] }
aes-gcm = "0.10"
uuid = { version = "1", features = ["v7"] }
tokio-tungstenite = "0.28"
futures-util = "0.3"
urlencoding = "2"
include_dir = "0.7"
base32 = "0.5"
time = "0.3"
