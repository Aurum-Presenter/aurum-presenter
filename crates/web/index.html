<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Aurum Presenter</title>
    <meta name="theme-color" content="#0b0c0f" />

    <link data-trunk rel="copy-file" href="../../web/manifest.webmanifest" />
    <link data-trunk rel="copy-dir" href="../../web/icons" />
    <link data-trunk rel="copy-dir" href="../../web/fonts" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <!-- Tailwind, built by the hook below and hashed by Trunk like any other asset. -->
    <link data-trunk rel="css" href="../../web/build/app.css" />

    <!--
      The app itself. Trunk compiles the crate to WebAssembly and writes the loader here.

      The optimiser has to be told which proposals the compiler used: rustc emits bulk-memory and
      the rest by default, and wasm-opt refuses to touch a module using features it was not asked
      to enable.
    -->
    <link
      data-trunk
      rel="rust"
      data-bin="aurum-web"
      data-wasm-opt="z"
      data-wasm-opt-params="--enable-bulk-memory --enable-bulk-memory-opt --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals --enable-reference-types --enable-multivalue"
    />

    <!--
      Chrome's PDF engine, for sheet music. Copied rather than hashed, and never imported: the
      renderer fetches it the first time a sheet is opened, which is the rule sheets already
      follow — a device that has never downloaded a sheet has nothing to render.
    -->
    <link data-trunk rel="copy-dir" href="../../web/build/pdfium" />

    <!-- The search index, off the main thread. See `search_worker.rs` for the measurement. -->
    <link
      data-trunk
      rel="rust"
      data-bin="search-worker"
      data-type="worker"
      data-loader-shim
      data-wasm-opt="z"
      data-wasm-opt-params="--enable-bulk-memory --enable-bulk-memory-opt --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals --enable-reference-types --enable-multivalue"
    />
  </head>
  <body></body>
</html>
