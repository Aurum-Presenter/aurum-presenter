<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Aurum Presenter</title>

    <!--
      The app itself. Trunk compiles the crate to WebAssembly and writes the loader here.

      The optimiser has to be told which proposals the compiler used: rustc emits bulk-memory and
      the rest by default, and wasm-opt refuses to touch a module using features it was not asked
      to enable.
    -->
    <link
      data-trunk
      rel="rust"
      data-wasm-opt="z"
      data-wasm-opt-params="--enable-bulk-memory --enable-bulk-memory-opt --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals --enable-reference-types --enable-multivalue"
    />
  </head>
  <body></body>
</html>
