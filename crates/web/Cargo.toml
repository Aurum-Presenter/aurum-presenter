[package]
name = "aurum-web"
description = "The Aurum Presenter client: Leptos, compiled to WebAssembly."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Two entry points: the app, and the worker that holds the search index.
[[bin]]
name = "aurum-web"
path = "src/main.rs"

[[bin]]
name = "search-worker"
path = "src/library/search_worker.rs"

[dependencies]
aurum-core.workspace = true
serde.workspace = true
serde_json.workspace = true
leptos = { version = "0.8", features = ["csr"] }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
leptos_router = "0.8"
serde-wasm-bindgen = "0.6"
gloo-timers = { version = "0.3", features = ["futures"] }
thiserror.workspace = true

[dependencies.web-sys]
version = "0.3"
features = [
  "console",
  "Headers",
  "Request",
  "RequestInit",
  "RequestCredentials",
  "Response",
  "Window",
  "Storage",
  "Navigator",
  "Location",
  "AbortController",
  "AbortSignal",
  "IdbFactory",
  "IdbOpenDbRequest",
  "IdbRequest",
  "IdbDatabase",
  "IdbTransaction",
  "IdbTransactionMode",
  "IdbObjectStore",
  "IdbObjectStoreParameters",
  "IdbIndex",
  "IdbIndexParameters",
  "IdbCursorWithValue",
  "IdbKeyRange",
  "IdbVersionChangeEvent",
  "DomStringList",
  "DomException",
  "Event",
  "EventTarget",
  "BroadcastChannel",
  "MessageEvent",
  "Worker",
  "WorkerOptions",
  "WorkerType",
  "WorkerGlobalScope",
  "DedicatedWorkerGlobalScope",
  "ClipboardEvent",
  "DataTransfer",
  "HtmlTextAreaElement",
  "SubmitEvent",
  "Document",
  "VisibilityState",
  "TouchEvent",
  "TouchList",
  "Touch",
  "KeyboardEvent",
  "DragEvent",
  "HtmlInputElement",
  "Blob",
  "File",
  "FileList",
  "BlobPropertyBag",
  "StorageManager",
  "Crypto",
  "SubtleCrypto",
  "Url",
]

[dev-dependencies]
wasm-bindgen-test = "0.3"
any_spawner = { version = "0.3", features = ["wasm-bindgen"] }
gloo-timers = { version = "0.3", features = ["futures"] }
